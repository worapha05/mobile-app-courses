# Sample GitHub Actions workflow — copy to .github/workflows/flutter-release.yml
# and adapt signing secrets for your org.

name: Flutter Release

on:
 push:
 tags:
 - 'v*'
 workflow_dispatch:

jobs:
 test:
 runs-on: ubuntu-latest
 steps:
 - uses: actions/checkout@v4
 - uses: subosito/flutter-action@v2
 with:
  channel: stable
  cache: true
 - run: flutter pub get
 - run: flutter analyze
 - run: flutter test

 build-android:
 needs: test
 runs-on: ubuntu-latest
 steps:
 - uses: actions/checkout@v4
 - uses: subosito/flutter-action@v2
 with:
  channel: stable
 - run: flutter pub get
 - name: Decode keystore
 run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/upload-keystore.jks
 - name: Build App Bundle
 env:
  KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
  KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
  KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
 run: |
  flutter build appbundle \
  --flavor prod \
  -t lib/main_prod.dart \
  --obfuscate \
  --split-debug-info=build/symbols \
  --dart-define=FLAVOR=production
 - uses: actions/upload-artifact@v4
 with:
  name: app-release-aab
  path: build/app/outputs/bundle/prodRelease/app-prod-release.aab
 - uses: actions/upload-artifact@v4
 with:
  name: android-symbols
  path: build/symbols

 build-ios:
 needs: test
 runs-on: macos-latest
 steps:
 - uses: actions/checkout@v4
 - uses: subosito/flutter-action@v2
 with:
  channel: stable
 - run: flutter pub get
 - name: Build IPA via Fastlane
 working-directory: ios
 env:
  MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
  APP_STORE_CONNECT_API_KEY: ${{ secrets.ASC_API_KEY }}
 run: bundle exec fastlane beta
